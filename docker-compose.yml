services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: dattaconect
      POSTGRES_USER: datta
      POSTGRES_PASSWORD: datta123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  frontend:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://datta:datta123@db:5432/dattaconect
      JWT_SECRET: dattaconect_jwt_secret_apenas_desenvolvimento
      ADMIN_EMAIL: admin@dattaconect.com.br
      ADMIN_PASSWORD: admin123
    ports:
      - "80:80"

volumes:
  pgdata:
